# The Lumbridge Swamp crab. Change `name` and `param.hpbar_name` (the boss bar title),
# and the remains' name, to rename it, then rebuild the cache; players see the new name
# after they restart their client.

[[npc]]
id = "npc.swamp_gemstone_crab"
inherit = "npc.gemstone_crab"
name = "Danny DeVito"
examine = "Fill me up with cream. Turn me into cannoli."
moveRestrict = "NoMove"
wanderRange = 0
models = ["models.devito_boss"]
standAnim = "seq.devito_boss_idle"
walkAnim = "seq.devito_boss_walk"
rotateLeftAnim = "seq.devito_boss_walk"
rotateRightAnim = "seq.devito_boss_walk"
rotateBackAnim = "seq.devito_boss_walk"
walkLeftAnim = "seq.devito_boss_walk"
walkRightAnim = "seq.devito_boss_walk"
widthScale = 128
heightScale = 128
originalColours = []
modifiedColours = []
originalTextureColours = []
modifiedTextureColours = []
[npc.params]
"param.hpbar_name"="Danny DeVito, Destroyer of Worlds"
"param.headbar"="headbar.health_120"
"param.hitpoints_locked"=true
"param.npc_com_xp_multiplier"=875
"param.npc_attack_type"="category.attacktype_crush"
"param.poison_immunity"=1
"param.venom_immunity"=2
"param.cannon_immunity"=1
"param.thrall_immunity"=1
"param.burn_immunity"=1
"param.freeze_resistance"=100
"param.attack_anim"="seq.devito_boss_attack"
"param.death_anim"="seq.devito_boss_death"

[[npc]]
id = "npc.swamp_gemstone_crab_remains"
inherit = "npc.gemstone_crab_remains"
name = "Danny DeVito remains"
moveRestrict = "NoMove"
wanderRange = 0
defaultMode = "None"
models = ["models.devito_boss_remains"]
standAnim = "seq.devito_boss_remains_idle"
walkAnim = "seq.devito_boss_remains_idle"
rotateLeftAnim = "seq.devito_boss_remains_idle"
rotateRightAnim = "seq.devito_boss_remains_idle"
rotateBackAnim = "seq.devito_boss_remains_idle"
walkLeftAnim = "seq.devito_boss_remains_idle"
walkRightAnim = "seq.devito_boss_remains_idle"
widthScale = 128
heightScale = 128
originalColours = []
modifiedColours = []
originalTextureColours = []
modifiedTextureColours = []
